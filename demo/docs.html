<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kubi-sdk API リファレンス</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; line-height: 1.7; }
  header { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 8px 16px; background: Canvas; border-bottom: 1px solid #8884; font-size: 14px; }
  header a { color: #36c; text-decoration: none; }
  header a.on { font-weight: 700; color: inherit; }
  header .sep { color: #8888; }
  .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); max-width: 1120px; margin-inline: auto; }
  nav { position: sticky; top: 42px; align-self: start; max-height: calc(100vh - 42px); overflow: auto; padding: 12px 8px 24px 16px; font-size: 13px; }
  nav a { display: block; padding: 1px 0; color: inherit; text-decoration: none; overflow-wrap: anywhere; }
  nav a:hover { color: #36c; }
  nav a.h2 { margin-top: 10px; font-weight: 700; }
  nav a.h3 { padding-left: 10px; color: #777; }
  main { padding: 8px 24px 80px; min-width: 0; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } nav { position: static; max-height: 220px; border-bottom: 1px solid #8884; } }

  h1 { font-size: 24px; }
  h2 { font-size: 20px; margin: 40px 0 8px; padding-top: 12px; border-top: 1px solid #8884; }
  h3 { font-size: 16px; margin: 32px 0 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  h4 { font-size: 15px; margin: 24px 0 4px; }
  h2, h3, h4 { scroll-margin-top: 52px; }
  main a { color: #36c; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em; background: #8882; padding: 1px 4px; border-radius: 4px; }
  pre { background: #8881; padding: 10px 12px; border-radius: 6px; overflow: auto; font-size: 13px; line-height: 1.5; }
  pre code { background: none; padding: 0; font-size: inherit; }
  table { border-collapse: collapse; font-size: 14px; margin: 8px 0; display: block; overflow: auto; }
  th, td { border: 1px solid #8884; padding: 4px 10px; text-align: left; vertical-align: top; }
  th { background: #8881; }
  ul { padding-left: 22px; }
  .error { color: #c33; }
</style>
</head>
<body>
<header id="bar"></header>
<div class="layout">
  <nav id="toc"></nav>
  <main id="doc">読み込み中…</main>
</div>
<script type="module" src="./docs.js"></script>
</body>
</html>
